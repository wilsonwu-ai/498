<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1920 1080" role="img" aria-labelledby="mbpp-split-title mbpp-split-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="mbpp-split-title">Same code, three math libraries</title>
<desc id="mbpp-split-desc">MBPP task 180 run through Apple's math library gives 12179.372041317427, one ulp below the answer key, so exact equality fails; Linux glibc and Chrome's V8 both give 12179.372041317429 and pass. iPhones use Apple's library, Android uses V8.</desc>
<style>
.dg{--dg-paper:#EEF1F4;--dg-box:#FFFFFF;--dg-ink:#111A23;--dg-muted:#4F5D6C;--dg-rule:#C3CBD3;--dg-fail:#C9361F;--dg-fail-tint:#FBE6E1;--dg-pass:#17774A;--dg-pass-tint:#E1F1E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dg,.dg:root{--dg-paper:#0E151C;--dg-box:#17212B;--dg-ink:#E8EEF4;--dg-muted:#A3B1BF;--dg-rule:#34424F;--dg-fail:#FF6A55;--dg-fail-tint:#3B1A15;--dg-pass:#4CC98A;--dg-pass-tint:#12301F}}
:root[data-theme="dark"] .dg{--dg-paper:#0E151C;--dg-box:#17212B;--dg-ink:#E8EEF4;--dg-muted:#A3B1BF;--dg-rule:#34424F;--dg-fail:#FF6A55;--dg-fail-tint:#3B1A15;--dg-pass:#4CC98A;--dg-pass-tint:#12301F}
.dg .bg{fill:var(--dg-paper)}
.dg .box{fill:var(--dg-box);stroke:var(--dg-ink);stroke-width:3}
.dg .box-fail{fill:var(--dg-fail-tint);stroke:var(--dg-fail);stroke-width:4}
.dg .box-pass{fill:var(--dg-pass-tint);stroke:var(--dg-pass);stroke-width:3}
.dg .wire{fill:none;stroke:var(--dg-muted);stroke-width:4}
.dg .head{fill:var(--dg-muted)}
.dg .hair{stroke:var(--dg-rule);stroke-width:2}
.dg .t-title{fill:var(--dg-ink);font-size:56px;font-weight:700;letter-spacing:-0.01em}
.dg .t-sub{fill:var(--dg-muted);font-size:32px}
.dg .t-eyebrow{fill:var(--dg-muted);font-size:32px;letter-spacing:0.12em;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dg .t-name{fill:var(--dg-ink);font-size:40px;font-weight:700}
.dg .t-small{fill:var(--dg-muted);font-size:32px}
.dg .t-mono{fill:var(--dg-ink);font-size:40px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dg .t-code{fill:var(--dg-muted);font-size:32px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.dg .d-fail{fill:var(--dg-fail);font-weight:800}
.dg .d-pass{fill:var(--dg-pass);font-weight:800}
.dg .v-fail{fill:var(--dg-fail);font-size:56px;font-weight:800;letter-spacing:0.04em}
.dg .v-pass{fill:var(--dg-pass);font-size:56px;font-weight:800;letter-spacing:0.04em}
</style>
